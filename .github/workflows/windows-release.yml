name: Проверка установщика Windows
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (drafts are supported)
        required: false
      previous_tag:
        description: Optional previous release to install before upgrading
        required: false
  release:
    types: [published]
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Verify the package, upgrade and launch Sange
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $selector = @(if ($env:TAG) { $env:TAG })
          $release = gh release view @selector --repo $env:GITHUB_REPOSITORY --json assets,tagName | ConvertFrom-Json
          $asset = @($release.assets | Where-Object name -like '*-Windows-x64.exe')
          if ($asset.Count -eq 0) {
            $version = $release.tagName -replace '^v', ''
            $descriptor = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$($release.tagName)/licensing/releases/$version/release.json"
            $scope = Invoke-RestMethod -Uri $descriptor
            if ($scope.platforms -notcontains 'Windows') { Write-Host 'Выпуск не содержит Windows; проверка установщика не применяется.'; return }
          }
          if ($asset.Count -ne 1) { throw 'Ожидался один установщик Windows' }
          gh release download $release.tagName --repo $env:GITHUB_REPOSITORY --pattern $asset[0].name --dir $env:RUNNER_TEMP
          $exe = Join-Path $env:RUNNER_TEMP $asset[0].name
          $hash = (Get-FileHash -LiteralPath $exe).Hash
          if ("sha256:$hash" -ne $asset[0].digest) { throw 'Контрольная сумма расходится с GitHub' }
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (!(Test-Path -LiteralPath $scanner)) { throw 'Сканер Defender недоступен' }
          Update-MpSignature -ErrorAction Stop
          Get-MpComputerStatus | Select-Object AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List
          & $scanner -Scan -ScanType 3 -File $exe -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender не подтвердил чистую проверку (код $LASTEXITCODE). Установка остановлена." }
          $sentinel = Join-Path $env:LOCALAPPDATA 'SCrip\upgrade-test-sentinel.txt'
          if ($env:PREVIOUS_TAG) {
            $previousDir = Join-Path $env:RUNNER_TEMP 'previous'
            New-Item -ItemType Directory -Path $previousDir -Force | Out-Null
            gh release download $env:PREVIOUS_TAG --repo $env:GITHUB_REPOSITORY --pattern '*-Windows-x64.exe' --dir $previousDir
            if ($LASTEXITCODE -ne 0) { throw 'Previous installer download failed' }
            $previous = @(Get-ChildItem $previousDir -Filter '*.exe')
            if ($previous.Count -ne 1) { throw 'Expected one previous installer' }
            $oldSetup = Start-Process -FilePath $previous[0].FullName -ArgumentList '/S' -PassThru -Wait
            if ($oldSetup.ExitCode -ne 0) { throw 'Previous installer failed' }
            New-Item -ItemType Directory -Path (Split-Path $sentinel) -Force | Out-Null
            Set-Content -LiteralPath $sentinel -Value 'upgrade-preservation-fixture'
          }
          $setup = Start-Process -FilePath $exe -ArgumentList '/S' -PassThru -Wait
          if ($env:PREVIOUS_TAG -and (Get-Content -LiteralPath $sentinel -Raw).Trim() -ne 'upgrade-preservation-fixture') { throw 'Application data was lost during upgrade' }

          if ($setup.ExitCode -ne 0) { throw "Установщик завершился с кодом $($setup.ExitCode)" }
          $player = Start-Process "$env:LOCALAPPDATA\Programs\SCrip\SCrip.exe" -PassThru
          try {
            for ($i = 0; $i -lt 30; $i++) {
              $player.Refresh()
              if ($player.HasExited) { throw "Sange завершился с кодом $($player.ExitCode)" }
              if ($player.MainWindowHandle -ne 0) { Write-Host 'Окно Sange открыто'; return }
              Start-Sleep 1
            }
            throw 'Окно Sange не появилось'
          } finally {
            if (!$player.HasExited) { Stop-Process -Id $player.Id }
          }
