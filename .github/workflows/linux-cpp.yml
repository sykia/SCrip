name: Linux C++ tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build pkg-config libsecret-1-dev libgl1-mesa-dev ffmpeg dbus-daemon pulseaudio

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          # Match the Qt runtime used by the local HLS regression checks.
          version: 6.12.0
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtshadertools

      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/ci --parallel 2

      - name: Start virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=scrip_ci
          pactl set-default-sink scrip_ci

      - name: Generate HLS fixture
        run: bash tests/run-hls-seek.sh --generate-only > build/ci/hls-fixture.log 2>&1

      - name: Run C++ tests with HLS and session D-Bus
        run: |
          export SCRIP_HLS_TEST_PLAYLIST="$GITHUB_WORKSPACE/build/hls-seek-fixture/test.m3u8"
          status=0
          dbus-run-session -- ctest --test-dir build/ci --verbose > build/ci/ctest.log 2>&1 || status=$?
          cat build/ci/ctest.log
          # CTest can succeed when Qt Test skips individual methods. Require
          # explicit passes only for these integration checks.
          for check in 'HlsSeekTest::seekKeepsDecodedAudio' 'StreamCacheTest::hlsSeekThroughCache' 'SoundCloudTest::mprisSessionBusProtocol'; do
            if ! grep -Eq "PASS[[:space:]]*:[[:space:]]+$check\(\)" build/ci/ctest.log; then
              echo "Required integration check did not pass: $check"
              status=1
            fi
          done
          exit "$status"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-diagnostics
          path: |
            build/ci/*.log
            build/ci/Testing/Temporary/
          if-no-files-found: ignore
