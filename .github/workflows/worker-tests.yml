name: Cloudflare Worker tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Run Worker tests
        run: node --test tests/worker.test.mjs
