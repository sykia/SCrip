name: Интеграционная проверка Windows-установщика
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'tests/test_windows_installer.py'
      - 'tests/windows_installer_integration.ps1'
      - '.github/workflows/windows-installer-test.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/windows/**'
      - 'tests/test_windows_installer.py'
      - 'tests/windows_installer_integration.ps1'
      - '.github/workflows/windows-installer-test.yml'
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Установить NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Выполнить интеграционный сценарий NSIS
        shell: pwsh
        run: ./tests/windows_installer_integration.ps1
