name: Лицензии и материалы релиза
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_licenses.py --repo .
      - run: python -m unittest discover -s tests -p 'test_licenses.py'
  release-materials:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full libarchive-tools
      - name: Скачать материалы соответствующего релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -eu
          args=()
          if [ -n "$TAG" ]; then args+=("$TAG"); fi
          mkdir -p build/release-assets
          gh release download "${args[@]}" --repo "$GITHUB_REPOSITORY" --dir build/release-assets
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName); fi
          release_dir="licensing/releases/${TAG#v}"
          if [ -f "$release_dir/release.json" ]; then
            python scripts/prepare_release_materials.py --release-dir "$release_dir" --output build/compliance --bundle build/base-compliance.tar.gz
            mapfile -t platforms < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["platforms"]))' "$release_dir/release.json")
            platform_args=()
            for platform in "${platforms[@]}"; do platform_args+=(--platform "$platform"); done
            python scripts/audit_release.py --assets build/release-assets --materials build/compliance "${platform_args[@]}"
          else
            mkdir -p build/compliance
            cp build/release-assets/compliance.tar.gz build/compliance.tar.gz
            python -c 'import tarfile; tarfile.open("build/compliance.tar.gz").extractall("build/compliance", filter="data")'
            python scripts/audit_release.py --assets build/release-assets --materials build/compliance
          fi
