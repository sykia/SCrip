name: Sange licensing and release checks
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_licenses.py --repo .
      - run: python scripts/check_secrets.py --mode tracked
      - run: python -m unittest discover -s tests -p 'test_*.py'
  release-materials:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Подготовить закреплённый распаковщик NSIS
        shell: bash
        run: |
          set -eu
          mkdir -p build/7zip
          curl --fail --location --retry 3 https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-x64.tar.xz -o build/7zip.tar.xz
          echo '22cf82fcc6eb7474f1d5bb4f02c0f8ebd573a718089d6833dc30f8350a3b232e  build/7zip.tar.xz' | sha256sum -c -
          tar -xJf build/7zip.tar.xz -C build/7zip
          ln -s 7zz build/7zip/7z
          echo "$PWD/build/7zip" >> "$GITHUB_PATH"
      - name: Скачать материалы соответствующего релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -eu
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName); fi
          args=()
          if [ -n "$TAG" ]; then args+=("$TAG"); fi
          mkdir -p build/release-assets
          gh release download "${args[@]}" --repo "$GITHUB_REPOSITORY" --dir build/release-assets
          if compgen -G 'build/release-assets/*-macOS-*.dmg' >/dev/null; then
            if compgen -G 'build/release-assets/*.apk' >/dev/null || compgen -G 'build/release-assets/*.exe' >/dev/null || compgen -G 'build/release-assets/*.deb' >/dev/null; then
              echo 'Auditing macOS checksums here and legacy platform inventories below.'
            fi
            test -f build/release-assets/macOS-arm64-compliance.json
            test -f build/release-assets/macOS-x86_64-compliance.json
            (cd build/release-assets && sha256sum -c SHA256SUMS)
            echo 'macOS DMG mounting and complete inventory/source audit run in the native macOS job.'
            if ! compgen -G 'build/release-assets/*.apk' >/dev/null && ! compgen -G 'build/release-assets/*.exe' >/dev/null && ! compgen -G 'build/release-assets/*.deb' >/dev/null; then exit 0; fi
          fi
          release_dir="licensing/releases/${TAG#v}"
          if [ -f "$release_dir/release.json" ]; then
            python scripts/prepare_release_materials.py --release-dir "$release_dir" --output build/compliance --bundle build/base-compliance.tar.gz --assets build/release-assets
            mapfile -t platforms < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["platforms"]))' "$release_dir/release.json")
            platform_args=()
            for platform in "${platforms[@]}"; do platform_args+=(--platform "$platform"); done
            python scripts/audit_release.py --assets build/release-assets --materials build/compliance "${platform_args[@]}"
          else
            mkdir -p build/compliance
            cp build/release-assets/compliance.tar.gz build/compliance.tar.gz
            python -c 'import tarfile; tarfile.open("build/compliance.tar.gz").extractall("build/compliance", filter="data")'
            python scripts/audit_release.py --assets build/release-assets --materials build/compliance
          fi
  release-macos:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit actual published macOS disk images
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName); fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q -- '-macOS-.*\.dmg$'; then
            echo 'No macOS assets in this release'; exit 0
          fi
          mkdir -p build/macos-release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir build/macos-release-assets
          (cd build/macos-release-assets && shasum -a 256 -c SHA256SUMS)
          for arch in arm64 x86_64; do
            python packaging/macos/compliance.py --image "build/macos-release-assets/Sange-${TAG#v}-macOS-$arch.dmg" --assets build/macos-release-assets --manifest "build/macos-release-assets/macOS-$arch-compliance.json"
          done
